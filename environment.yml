name: my_project_env       # The name used to activate the environment
channels:                  # Repositories where conda looks for packages
  - conda-forge            # Recommended community-led channel (high stability)
  - defaults               # Standard Anaconda channel
dependencies:              # Core packages installed via conda
  - python=3.10            # Pinning major/minor version ensures consistency
  - pip                    # Required to safely manage secondary pip installs
  - numpy>=1.22
  - pandas=2.1.*           # Wildcards allow patch updates but lock minor versions
  - scikit-learn
